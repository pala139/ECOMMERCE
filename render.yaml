services:
  - type: keyvalue
    name: ecommerce-cache
    plan: free
    region: singapore
    ipAllowList: []
  - type: web
    name: ecommerce-backend
    runtime: docker
    branch: main
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CATEGORY_CACHE_ENABLED
        value: "true"
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: ecommerce-cache
          property: connectionString
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=50.0"
